<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>За теб ❤️</title>
<style>
* { box-sizing: border-box; }

html { min-height: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
  overflow-x: hidden;
  overflow-y: auto;
  padding: 20px 0;
}

.card {
  width: 90%;
  max-width: 420px;
  padding: 35px 20px;
  text-align: center;
  background: white;
  border-radius: 25px;
  box-shadow: 0 10px 40px rgba(0,0,0,.25);
  position: relative;
  z-index: 10;
  margin: 20px 0;
}

h1 {
  color: #ff4772;
  font-size: 30px;
  margin-bottom: 30px;
}

button {
  border: none;
  border-radius: 15px;
  padding: 14px 28px;
  margin: 7px;
  font-size: 18px;
  font-weight: bold;
  background: #ff4772;
  color: white;
  cursor: pointer;
  transition: .2s;
}

button:active { transform: scale(.95); }

.letter {
  font-size: 19px;
  line-height: 1.7;
  color: #444;
  text-align: center;
}

.heart {
  position: fixed;
  top: -40px;
  font-size: 25px;
  z-index: 1;
  pointer-events: none;
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

/* Екран за парола */
#lock {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: linear-gradient(135deg, #ff758c, #ff7eb3);
}

.lock-box {
  width: 100%;
  max-width: 380px;
  background: white;
  padding: 30px 20px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,.25);
}

.lock-box h2 { color: #ff4772; }

.lock-box input {
  width: 90%;
  padding: 13px;
  border: 2px solid #ffb3c2;
  border-radius: 12px;
  font-size: 18px;
  outline: none;
  margin: 10px 0;
}

#error {
  color: #d6335c;
  min-height: 24px;
}
</style>
</head>

<body>

<div id="lock">
  <div class="lock-box">
    <h2>Само за нас ❤️</h2>
    <p>Въведи паролата 💌</p>
    <input id="password" type="password" placeholder="Парола">
    <br>
    <button onclick="unlock()">Влез ❤️</button>
    <div id="error"></div>
  </div>
</div>

<div class="card">
  <h1 id="title">Обичаш ли ме? ❤️</h1>

  <div id="content">
    <button onclick="answerYes()">Да ❤️</button>
    <button onclick="answerNo()">Не 😢</button>
  </div>
</div>

<script>
/* СМЕНИ ТАЗИ ПАРОЛА с твоя */
const SITE_PASSWORD = "290825";

function unlock() {
  const input = document.getElementById("password").value;
  const error = document.getElementById("error");

  if (input === SITE_PASSWORD) {
    document.getElementById("lock").style.display = "none";
  } else {
    error.innerText = "Грешна парола 🥺";
  }
}

const title = document.getElementById("title");
const content = document.getElementById("content");

function answerYes() {
  title.innerText = "Знаех си! 🥹❤️";
  content.innerHTML = `
    <button onclick="openLetter()">Към писмото 💌</button>
  `;
  makeHearts();
}

function answerNo() {
  title.innerText = "Наистина ли? 🥺";
  content.innerHTML = `
    <button onclick="reallyYes()">Да ❤️</button>
    <button onclick="reallyNo()">Не 😢</button>
  `;
}

function reallyYes() {
  title.innerText = "Еми... ❤️";
  content.innerHTML = `
    <p class="letter">
      Просто исках да знаеш колко много те обичам. ❤️🥹
    </p>
    <button onclick="openLetter()">Към писмото 💌</button>
  `;
  makeHearts();
}

function reallyNo() {
  title.innerText = "Знаех си! 🥹❤️";
  content.innerHTML = `
    <button onclick="openLetter()">Към писмото 💌</button>
  `;
  makeHearts();
}

function openLetter() {
  title.innerText = "За теб, любов моя ❤️";
  content.innerHTML = `
    <div class="letter">
      Много те обичам, любов моя. ❤️<br><br>
      Искам да знаеш, че ти си всичко,
      което съм искал и имам нужда. ❤️<br><br>
      Страшно много те обичам, беби! 🥹❤️<br><br>
      Цуфкиии 😘😘😘
    </div>
  `;
  makeHearts();
}

function makeHearts() {
  for (let i = 0; i < 20; i++) {
    setTimeout(() => {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      const hearts = ["❤️", "💕", "💗", "💖", "💘"];
      heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (3 + Math.random() * 4) + "s";
      heart.style.fontSize = (15 + Math.random() * 25) + "px";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }, i * 150);
  }
}

setInterval(() => {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerText = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 8000);
}, 700);
</script>

</body>
</html>
